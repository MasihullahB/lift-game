<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lift Simulation</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-body-tertiary">
    <main class="container-fluid min-vh-100 py-4">
      <div class="row g-4 h-100">
        <section class="col-12 col-md-4 col-lg-3">
          <div class="bg-white border rounded-3 p-4 h-100">
            <h1 class="h4 mb-4">Lift Simulation</h1>

            <form>
              <div class="mb-3">
                <label for="liftCount" class="form-label">Lifts</label>
                <input
                  type="number"
                  class="form-control"
                  id="liftCount"
                  name="liftCount"
                  min="1"
                  placeholder="Enter number of lifts"
                />
              </div>

              <div class="mb-3">
                <label for="floorCount" class="form-label">Floors</label>
                <input
                  type="number"
                  class="form-control"
                  id="floorCount"
                  name="floorCount"
                  min="1"
                  placeholder="Enter number of floors"
                />
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Generate Lift System
              </button>
            </form>
          </div>
        </section>

        <section class="col-12 col-md-8 col-lg-9">
          <div class="bg-white border rounded-3 p-4 min-vh-100">
            <h2 class="h5 mb-4">Lift System</h2>

            <div
              id="lift-system"
              class="border rounded-3 bg-body-secondary min-vh-100"
              aria-label="Lift system rendering area"
            ></div>
          </div>
        </section>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="src/index.js" async></script>
  </body>
</html>
